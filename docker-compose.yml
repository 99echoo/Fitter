version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fitter-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitter_password}
      POSTGRES_DB: ${POSTGRES_DB:-fitter}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitter}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: fitter-pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@fitter.local
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - postgres

volumes:
  postgres_data:
